<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account – OfferPath</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      background: radial-gradient(circle at top right, #eef2ff, #f8fafc 60%);
    }
    .register-card {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: var(--radius-lg);
      border: 1px solid var(--gray-200);
      box-shadow: var(--shadow-lg);
      padding: 3rem 2.5rem;
    }
  </style>
</head>
<body>

  <div class="auth-page-wrapper">
    <div class="register-card">
      
      <div style="display: flex; align-items: center; gap: 0.65rem; margin-bottom: 1.5rem;">
        <div class="brand-icon">OP</div>
        <span style="font-size: 1.25rem; font-weight: 800; color: var(--primary);">OfferPath</span>
      </div>

      <h2 style="font-size: 1.6rem; font-weight: 800; margin-bottom: 0.35rem;">Create your account</h2>
      <p style="font-size: 0.92rem; margin-bottom: 1.75rem;">Get started with intelligent application tracking and resume optimization.</p>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-fullname">Full Name</label>
          <input type="text" id="reg-fullname" class="form-control" placeholder="e.g. Alex Rivera" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="reg-username">Username</label>
            <input type="text" id="reg-username" class="form-control" placeholder="alexrivera" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-role">Target Role</label>
            <input type="text" id="reg-role" class="form-control" placeholder="e.g. Full Stack Engineer">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="alex@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password (minimum 6 characters)</label>
          <input type="password" id="reg-password" class="form-control" placeholder="••••••••" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 0.75rem;">
          Register Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem;">
        Already registered? <a href="/login" style="font-weight: 700;">Sign in here →</a>
      </div>

    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
